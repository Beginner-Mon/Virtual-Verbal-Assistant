# LangGraph Agent Configuration (v2.4.1)
# Pruned: removed dead v2.2 keys (manager_model, services.kimodo, celery)

langgraph:
  # LLM defaults are in code (llm.py). Config here only for runtime overrides.
  # Set DEEPSEEK_MODEL / DEEPSEEK_BASE_URL env vars to override.

  memory:
    redis_url: "redis://localhost:6379"   # DB 0 (STM + task_result)
    stm_session_ttl: 7200                 # 2h
    ltm_top_k: 5

  retrieval:
    top_k: 5
    web_search_enabled: true
    web_search_max_results: 3

  services:
    vieneu_tts:
      url: "http://localhost:5000"
      endpoint: "/synthesize"
      # Measured on this box (VieNeu turbo, CPU): ~18ms per character —
      # 13 chars 0.4s / 186 chars 3.1s / 558 chars 10.2s. A clinical answer runs
      # 1500-2500 chars = 28-46s, so the old value of 15 timed out on every real
      # reply and the UI only ever saw speech_failed.
      timeout: 120
      circuit_breaker:
        failure_threshold: 3
        cool_down_seconds: 60

  postgres:
    dsn: "postgresql://eca:eca_dev@localhost:5433/eca"
    pool_min: 2
    pool_max: 10

  persona:
    default: "eca_default"
    personas_dir: "langgraph_agents/personas"
    voices_dir: "voices"
