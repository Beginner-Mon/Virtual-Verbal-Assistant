[pytest]
testpaths = tests
# text-to-motion/DART is deliberately NOT here. DART is the legacy backup of the
# Kimodo path and is out of scope; leaving its root on the global pythonpath had
# it shadowing two live modules, because `sys.modules` has one slot per top-level
# name and DART sorted ahead of both:
#   api_server.py  -> shadowed SpeechLLm/api_server.py (tests/SpeechLLm failed at
#                     import: no clean_text_for_tts, no TTSRequest, no app)
#   mcp_server.py  -> shadowed text-to-motion/kimodo/mcp_server.py
# tests/text-to-motion/DART/conftest.py puts its own root on sys.path, so that
# suite still runs on its own. It cannot share a pytest process with
# tests/SpeechLLm either way — one name, one slot, whoever imports first wins.
pythonpath = agenticRAG text-to-motion/kimodo SpeechLLm
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --durations=5

markers =
    unit: No I/O, pure logic
    integration: Requires running services (DB, Redis, etc.)
    e2e: Full stack, runs against staging
    slow: Over 2 seconds

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::ResourceWarning
    ignore::ImportWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::UserWarning

log_cli = false
log_level = WARNING
