services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vva-postgres
    environment:
      POSTGRES_DB: vva
      POSTGRES_USER: vva
      POSTGRES_PASSWORD: vva_dev
    ports:
      - "5433:5432"
    # Without this, a Docker Desktop restart (or a host reboot) leaves the
    # container stopped and every request fails on a dead pool. searxng already
    # had the policy; postgres and redis did not, which is backwards — the
    # optional service survived reboots and the critical ones did not.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vva -d vva"]
      interval: 3s
      timeout: 2s
      retries: 20
    # Postgres requires units like "MB"/"GB" — "1G" is invalid and causes FATAL.
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c effective_cache_size=1GB

  redis:
    image: redis:7-alpine
    container_name: vva-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  searxng:
    image: searxng/searxng:latest
    container_name: vva-searxng
    ports:
      - "6666:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    # SEARXNG_SECRET_KEY comes from here. It used to be interpolated from a
    # repo-root `.env` that existed to hold that one variable — a whole file, a
    # whole thing to hand a new teammate, for a single line. It lives in
    # agenticRAG/.env with the rest of the configuration now.
    #
    # `env_file` rather than `${SEARXNG_SECRET_KEY:?...}`: interpolation only
    # reads the project-directory .env or the shell, so pointing it at another
    # file would mean every `docker compose` command needing --env-file.
    env_file:
      - ./agenticRAG/.env
    environment:
      - SEARXNG_BASE_URL=http://localhost:6666/
      - INSTANCE_NAME=vva-search
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
