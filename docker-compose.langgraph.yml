services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vva-postgres
    environment:
      POSTGRES_DB: vva
      POSTGRES_USER: vva
      POSTGRES_PASSWORD: vva_dev
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vva -d vva"]
      interval: 3s
      timeout: 2s
      retries: 20
    # Postgres requires units like "MB"/"GB" — "1G" is invalid and causes FATAL.
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c effective_cache_size=1GB

  redis:
    image: redis:7-alpine
    container_name: vva-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M

  searxng:
    image: searxng/searxng:latest
    container_name: vva-searxng
    ports:
      - "6666:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:6666/
      - INSTANCE_NAME=vva-search
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:?must be set — see RUNBOOK}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
