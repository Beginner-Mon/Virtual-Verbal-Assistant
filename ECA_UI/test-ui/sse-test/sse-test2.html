<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SSE Test 2 — full body read</title>
<style>body{font-family:monospace;padding:20px}#out{padding:12px;background:#f4f4f4;white-space:pre-wrap;min-height:300px}</style>
</head>
<body>
<h2>SSE Test 2 — fetch with text() instead of streaming</h2>
<p>Click → đợi 10s → xem body có data không.</p>
<button id="b">Send</button>
<h3>Response body (full):</h3>
<div id="out">— click —</div>

<script>
document.getElementById("b").onclick = async () => {
  const out = document.getElementById("out");
  out.textContent = "Sending...";
  const t0 = Date.now();
  try {
    const resp = await fetch("http://localhost:8080/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        query: "test",
        user_id: "diag3",
        session_id: crypto.randomUUID(),
        web_search: false,
      }),
    });
    const elapsed = ((Date.now() - t0)/1000).toFixed(1);
    const body = await resp.text();
    out.textContent =
      "Status: " + resp.status + " " + resp.statusText + "\n" +
      "Elapsed: " + elapsed + "s\n" +
      "Content-Type: " + resp.headers.get("content-type") + "\n" +
      "Transfer-Encoding: " + resp.headers.get("transfer-encoding") + "\n" +
      "Body length: " + body.length + " chars\n" +
      "─────────────────────────────────\n" +
      body;
    console.log("[TEST2] status=" + resp.status, "body length=" + body.length);
    console.log("[TEST2] all headers:", [...resp.headers.entries()]);
  } catch (e) {
    out.textContent = "ERROR: " + e.message + "\n" + e.stack;
    console.error("[TEST2] fetch failed:", e);
  }
};
</script>
</body>
</html>
