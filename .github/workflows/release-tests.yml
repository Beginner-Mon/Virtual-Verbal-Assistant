name: Release Unit Tests

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Unit tests — matrix strategy for isolated environments
  #
  # Each matrix entry gets a FRESH runner with its own pip env.
  # Tests run from the repo root so pytest.ini + conftest.py work correctly.
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "🧪 ${{ matrix.module_name }}"
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false   # Don't cancel SpeechLLm if AgenticRAG fails
      matrix:
        include:
          # Replaces the "AgenticRAG Gemini" entry, deleted along with the
          # package it tested. Note what that means: until now CI covered the
          # service that was REPLACED and not the one actually shipping.
          #
          # `-m unit` on purpose — the rest of the suite wants a live Postgres,
          # Redis and an LLM key. Adding service containers is worth doing, but
          # it is a separate change from deleting a dead package.
          - module_name: "LangGraph Service"
            requirements: "requirements-langgraph.txt"
            test_dir: "tests/langgraph_agents"
            pytest_args: "-m unit"
            python_version: "3.12"
            extra_pythonpath: "agenticRAG"
            artifact_name: "langgraph-test-results"
            # sentence-transformers pulls torch (~2 GB); the install dominates.
            timeout: 40

          - module_name: "SpeechLLm"
            requirements: "SpeechLLm/requirements.txt"
            test_dir: "tests/SpeechLLm"
            pytest_args: ""
            python_version: "3.11"
            extra_pythonpath: "SpeechLLm"
            artifact_name: "speechllm-test-results"
            timeout: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: "pip"
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}
          pip install pytest httpx pytest-asyncio
        shell: bash

      # Run from repo root — pytest.ini and conftest.py handle paths
      - name: Run unit tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ matrix.extra_pythonpath }}
        run: |
          python -m pytest ${{ matrix.test_dir }} ${{ matrix.pytest_args }} \
            --override-ini="pythonpath=${{ matrix.extra_pythonpath }}" \
            --junitxml=test-results/${{ matrix.artifact_name }}.xml
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: test-results/${{ matrix.artifact_name }}.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend build — the gate that did not exist until 19-08.
  #
  # Before this, no workflow on any branch ran `npm run build`, so Amplify was
  # the first and only thing that ever type-checked the frontend. A compile error
  # surfaced as a red DEPLOYMENT — after the push, on the production branch —
  # rather than as a red check.
  #
  # ubuntu, not windows: nothing here is platform-specific and the Linux runner
  # is several times cheaper in billed minutes.
  #
  # `npm ci`, not `npm install`: ci installs exactly the lockfile and fails when
  # package.json and package-lock.json disagree. .gitattributes marks the
  # lockfile `merge=binary` because Amplify deployment #21 broke on a silent
  # auto-merge of it — this job is what would catch the next one.
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: "🏗️ Frontend Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ECA_UI/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reads ECA_UI/frontend/.nvmrc, which package.json pins via `engines`.
      # .gitattributes forces LF on that file: a trailing CR makes nvm ask for a
      # version literally named "22.18.0\r".
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ECA_UI/frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: ECA_UI/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b && vite build`. Note tsconfig.app.json does not set "strict", so
      # this catches syntax and resolution errors but not null-safety ones —
      # a weaker gate than it looks. Turning strict on is its own change.
      #
      # The env vars are placeholders, not the deployed values. vite.config.ts
      # fails the build when a required one is missing, and that check is the
      # point of running a build here: it is what would have caught the
      # deployment that shipped without VITE_ASSET_BASE_URL. What the values ARE
      # does not matter to a compile — only that the gate sees them, so CI tests
      # the gate rather than depending on secrets.
      #
      # The auth trio is here because amplify_outputs.json is gitignored and so
      # never exists in CI. On Amplify itself the build generates that file and
      # these three are not needed — which is exactly the distinction the gate
      # got wrong on its first day, failing a release build that would have
      # worked.
      - name: Build
        env:
          VITE_API_GATEWAY_URL: https://ci.invalid/v1
          VITE_ASSET_BASE_URL: https://ci.invalid
          VITE_AUTH_API_URL: https://ci.invalid/prod/
          VITE_USER_POOL_ID: us-east-1_ciinvalid
          VITE_USER_POOL_WEB_CLIENT_ID: ciinvalidclientid
        run: npm run build

      # The gate has to fail too, or it is not a gate. A build that succeeds with
      # a required variable removed means the check silently stopped running.
      - name: Build gate rejects a missing variable
        env:
          VITE_ASSET_BASE_URL: https://ci.invalid
          VITE_AUTH_API_URL: https://ci.invalid/prod/
          VITE_USER_POOL_ID: us-east-1_ciinvalid
          VITE_USER_POOL_WEB_CLIENT_ID: ciinvalidclientid
        run: |
          if npm run build > /dev/null 2>&1; then
            echo "::error::vite.config.ts built successfully without VITE_API_GATEWAY_URL — the required-env check is not running"
            exit 1
          fi
          echo "build correctly refused a missing VITE_API_GATEWAY_URL"

      - name: Unit tests
        run: npm run test

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary — collects JUnit XML from all modules
  # ─────────────────────────────────────────────────────────────────────────────
  test-summary:
    name: "📋 Test Summary"
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-build]
    if: always()

    steps:
      - name: Download all test result artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: Publish combined test report
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "all-results/**/*.xml"
          check_name: "Unit Test Results (All Modules)"
          fail_on_failure: true

      - name: Summarize job outcomes
        run: |
          echo "## 🧪 Release Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 LangGraph Service | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗣️ SpeechLLM          | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Frontend Build     | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
