name: Deploy Production Image to ECR

on:
  push:
    branches:
      - kimodo-release
    paths:
      - 'text-to-motion/kimodo/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kimodo
  AWS_ACCOUNT_ID: "244203483654"
  # v2 is required, not merely preferred: Dockerfile.prod now installs kimodo as a wheel
  # and relies on the v2 base for the boto3-based entrypoint and for setuptools being
  # present in the venv. Building against v1 produces an image that starts and then fails
  # to find its skeleton assets.
  #
  # ORDER MATTERS: run build-kimodo-base.yml (workflow_dispatch, base_tag v2) and verify
  # that image BEFORE merging anything to kimodo-release, or this job races a base that
  # does not exist yet.
  BASE_TAG: v2

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: text-to-motion/kimodo
          file: text-to-motion/kimodo/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}

