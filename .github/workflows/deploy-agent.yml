# Build the vva-agent container image and roll it onto the Lambda.
#
# Modelled on deploy-production.yml, which already does OIDC -> ECR for kimodo.
# Two things are done differently, both deliberately:
#
#   * IMMUTABLE TAGS ONLY. deploy-production.yml pushes `:latest` alongside the
#     sha; the ECR repository here is created with IMMUTABLE tag mutability, so
#     `latest` is not even possible. With a floating tag you cannot answer "which
#     build is running?" and cannot roll back to a specific one.
#
#   * CDK OWNS THE SHAPE, CI OWNS THE CODE. This workflow never runs `cdk
#     deploy`: it pushes an image and calls update-function-code, which takes
#     seconds. A full synth would need infra/build/crud_api.zip and would let two
#     different pipelines write the same infrastructure. Changing memory, timeout
#     or environment is a CDK deploy a human runs.
#
# Docker lives here and nowhere else — no developer machine needs a daemon.
#
# OIDC TRUST IS PER BRANCH. GitHubActionsECRRole's trust policy lists exact
# `sub` claims — `repo:<owner>/<repo>:ref:refs/heads/<branch>` — so a workflow on
# a branch that is not listed fails with:
#
#     Could not assume role with OIDC:
#     Not authorized to perform sts:AssumeRoleWithWebIdentity
#
# preceded by a dozen "Assuming role with OIDC" lines, which are the action's own
# retries and not a dozen different roles. `release` was added on 21-08; before
# that only `kimodo-release` was trusted. This is the design working, not a bug:
# it is what stops any branch anyone pushes from being able to publish an image.
# Adding a branch means editing the trust policy, deliberately.
#
# AND THE SUB IS NOT THE STRING YOU EXPECT. GitHub now mints it with the owner
# and repository IDs appended:
#
#     repo:Beginner-Mon@142661626/ProjectECA@1057715951:ref:refs/heads/release
#
# not `repo:<owner>/<repo>:ref:refs/heads/<branch>`. Every run from #14 (03-09)
# to #16 died here against a policy that matched the name-only form. Do not
# guess this string — read it. CloudTrail records the presented `sub` on the
# denial itself, which is the only place it appears in full:
#
#     aws cloudtrail lookup-events \
#       --lookup-attributes AttributeKey=EventName,AttributeValue=AssumeRoleWithWebIdentity
#
# The IDs are the durable half: they survive a rename, and a repository
# re-created under an old name gets a different ID and so cannot inherit the
# right to publish images. The trust policy lists both forms — the ID form is
# what GitHub sends today, the name form is there in case that changes back.
#
# This was first misdiagnosed as fallout from renaming the repository
# (Virtual-Verbal-Assistant -> ProjectECA, between 29-08 and 03-09), which fit
# the timing and is what `git push` warns about. Correcting the name in the
# policy changed nothing, because the format was never the name.
#
# What let it run four weeks unnoticed is worth knowing separately. Both test
# jobs pass — they need no AWS — so the run reaches `build-and-push` looking
# healthy, and the only symptom is that ECR holds no image for the commit,
# while the Lambda quietly keeps serving the last one that got through. When an
# agent deploy fails, check ECR for the sha before reading anything else.

name: Deploy Agent Image

on:
  push:
    branches:
      - release
    paths:
      - 'agenticRAG/**'
      - '.github/workflows/deploy-agent.yml'
  # The first build has to happen before VvaAgentStack can create the function
  # (a container Lambda cannot be created without an image), so it must be
  # runnable by hand rather than only by a push.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "244203483654"
  ECR_REPOSITORY: vva-agent
  FUNCTION_NAME: vva-agent

concurrency:
  # One deploy at a time. Two concurrent runs would race on
  # update-function-code and the last writer would win regardless of order.
  group: deploy-agent
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # TWO jobs, two environments, and the split is the point.
  #
  # The first version of this workflow ran the unit suite against
  # requirements-agent-runtime.txt, reasoning that the full list would pull torch
  # and hide a missing runtime dependency. That reasoning is right for the import
  # check and wrong for the test suite: the tests legitimately need packages the
  # IMAGE does not — alembic (test_rls_policies.py reads a migration) and
  # sentence-transformers (test_preflight asserts the torch backend's dependency
  # is importable). Ten tests failed for that reason on the first run.
  #
  # So: one job proves the image's dependency set is SUFFICIENT, the other proves
  # the code is CORRECT. Sharing an environment would make each a worse test of
  # the other.
  # ───────────────────────────────────────────────────────────────────────────
  runtime-imports:
    name: "📥 Image deps import the app"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ONLY what the image will contain. A missing runtime dependency shows up
      # here in seconds instead of at Lambda INIT, where it lands in CloudWatch
      # minutes later with no obvious cause and a 10-minute loop to retry.
      - name: Install the image's dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -r agenticRAG/requirements-agent-runtime.txt

      - name: Import the app, and prove torch is not there
        env:
          # torch, because the runner has no ONNX export to point at. The
          # embedding backend is not what this job checks — the import closure is.
          EMBEDDING_BACKEND: torch
          ENABLE_MCP: "false"
        run: |
          # text-to-motion/kimodo is on the path because `vva_motion` lives
          # there and api/motion_status.py imports it. In the image that COPY
          # lands it at /var/task/vva_motion (agenticRAG/Dockerfile:112), so
          # the import name is identical; here the repo layout has to be
          # spelled out. Without it this guard dies with
          # "ModuleNotFoundError: No module named 'vva_motion'" — which it did.
          PYTHONPATH=agenticRAG:text-to-motion/kimodo python -c "
          import sys
          from langgraph_agents.api.main import create_app
          create_app()
          for banned in ('torch', 'transformers', 'sentence_transformers'):
              assert banned not in sys.modules, f'{banned} reached the runtime set'
          print('import OK — none of torch/transformers/sentence_transformers')
          "

  unit-tests:
    name: "🧪 Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The FULL list, matching release-tests.yml. Tests that run against a
      # different dependency set than the developer's are tests of something
      # else — the same principle requirements-agent-runtime.txt states about
      # the image and local development.
      #
      # CPU torch first so pip does not pull the CUDA build, which is ~2.5 GB of
      # download for a runner that has no GPU.
      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-langgraph.txt

      # No .env here, and that is a feature: two tests passed only because a
      # developer machine had DEEPSEEK_API_KEY, and one of them was hiding a real
      # crash in planner_node. See test_phase6_circuit_breaker.py.
      - name: Run unit tests
        run: pytest tests/langgraph_agents -m unit -q

  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "📦 Build and push"
    needs: [unit-tests, runtime-imports]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Resolve image URI
        id: meta
        run: |
          echo "image-uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Immutable tags make a re-push of the same commit an error. Re-running a
      # workflow is a normal thing to do, so detect it and skip rather than fail
      # on something that is not wrong.
      - name: Skip build if this commit is already published
        id: exists
        run: |
          if aws ecr describe-images \
               --repository-name "${{ env.ECR_REPOSITORY }}" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.sha }} is already in ECR — skipping the build."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Context is the REPOSITORY ROOT, not agenticRAG/. The Dockerfile copies
      # both agenticRAG/ and config/, which have no common parent below the root
      # — and the layout inside the image has to mirror the repo because several
      # modules resolve config as Path(__file__).parents[3].
      - name: Build and push
        if: steps.exists.outputs.already == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: agenticRAG/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image-uri }}

          # LAMBDA CANNOT READ AN IMAGE INDEX. buildx has added provenance
          # attestations by default since v0.10, and an attestation makes the
          # pushed artifact an OCI image INDEX pointing at both the image and its
          # attestation, rather than a plain manifest. The push succeeds, ECR
          # accepts it, and the failure lands one step later at function
          # creation:
          #
          #     The image manifest, config or layer media type for the source
          #     image ... is not supported.
          #
          # Confirmed on the first pushed image: imageManifestMediaType was
          # application/vnd.oci.image.index.v1+json, and the repository held
          # three entries — the 437 MB image, a 52 KB attestation, and the index
          # over them. Lambda takes a single manifest, Docker v2 or OCI, but not
          # an index.
          provenance: false
          sbom: false

          # The image is ~1.2 GB and most of it is unchanged between commits.
          # Without a cache every run re-downloads torch to re-export a model
          # that did not change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Update function code"
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      # The function may not exist yet: a container Lambda cannot be created
      # before an image is pushed, so the FIRST run of this workflow legitimately
      # has nothing to update.
      #
      # This is a step OUTPUT rather than an `exit 0`, and the difference is a
      # bug that already happened: the earlier version exited zero here to mean
      # "nothing to do", but `exit 0` ends the STEP, not the JOB — so the smoke
      # step below ran anyway and died with
      #
      #     ResourceNotFoundException ... Function not found: ...vva-agent:$LATEST
      #
      # reporting a failed deploy for a build that had succeeded. Every step
      # after this one is now gated on the answer.
      - name: Does the function exist yet?
        id: fn
        run: |
          if aws lambda get-function --function-name "${{ env.FUNCTION_NAME }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: First run — the image is pushed, the function is not created
        if: steps.fn.outputs.exists == 'false'
        run: |
          echo "::notice::${{ env.FUNCTION_NAME }} does not exist yet — this is the bootstrap run."
          echo "The image is in ECR. Create the function with:"
          echo "    cdk deploy VvaAgentStack -c agent_image_tag=${{ github.sha }}"
          echo "Every run after that updates it in place."

      - name: Update the function code
        if: steps.fn.outputs.exists == 'true'
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --image-uri "${{ needs.build-and-push.outputs.image-uri }}" \
            --publish >/dev/null

          aws lambda wait function-updated \
            --function-name "${{ env.FUNCTION_NAME }}"

          echo "::notice::${{ env.FUNCTION_NAME }} now runs ${{ github.sha }}"

      # A green update-function-code only means Lambda ACCEPTED the image. It
      # does not mean the container starts: a bad CMD, a missing system library
      # or a model baked to the wrong path all fail at INIT, and INIT happens on
      # the first INVOCATION. Without this the workflow reports success on a
      # function that 502s.
      - name: Smoke the new image
        if: steps.fn.outputs.exists == 'true'
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --payload '{"version":"2.0","rawPath":"/health","rawQueryString":"","headers":{"host":"ci.internal"},"requestContext":{"http":{"method":"GET","path":"/health","protocol":"HTTP/1.1","sourceIp":"127.0.0.1"}},"isBase64Encoded":false}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/out.json >/tmp/meta.json

          cat /tmp/meta.json
          cat /tmp/out.json

          if grep -q '"FunctionError"' /tmp/meta.json; then
            echo "::error::The new image fails at invocation. Check CloudWatch for INIT errors."
            exit 1
          fi
